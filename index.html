<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Reminder</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            color: #f5f5f7;

            background:
                radial-gradient(
                    circle at 20% 15%,
                    rgba(255, 92, 38, 0.15),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(255, 120, 65, 0.10),
                    transparent 32%
                ),
                #07080b;
        }

        /* Ambient background */

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(110px);
            opacity: 0.13;
            animation: float 9s ease-in-out infinite alternate;
        }

        body::before {
            top: -220px;
            left: -160px;
            background: #ff5722;
        }

        body::after {
            right: -180px;
            bottom: -220px;
            background: #ff8a55;
            animation-delay: -4s;
        }

        @keyframes float {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(35px, 25px) scale(1.12);
            }
        }

        /* Main card */

        .card {
            width: min(100%, 500px);
            position: relative;
            z-index: 2;

            padding: 42px;

            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 30px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.075),
                    rgba(255, 255, 255, 0.025)
                );

            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);

            box-shadow:
                0 35px 100px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);

            animation: appear 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;

            border-radius: inherit;

            pointer-events: none;

            background:
                linear-gradient(
                    120deg,
                    rgba(255, 255, 255, 0.07),
                    transparent 35%,
                    transparent 70%,
                    rgba(255, 255, 255, 0.025)
                );
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Icon */

        .icon {
            width: 58px;
            height: 58px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 25px;

            border-radius: 18px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 107, 53, 0.18),
                    rgba(255, 107, 53, 0.045)
                );

            border: 1px solid rgba(255, 107, 53, 0.22);

            box-shadow:
                0 10px 35px rgba(255, 107, 53, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .icon svg {
            width: 27px;
            height: 27px;

            fill: none;
            stroke: #ff9a6a;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Text */

        .eyebrow {
            margin-bottom: 10px;

            color: #ff9a6a;

            font-size: 11px;
            font-weight: 700;

            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        h1 {
            margin-bottom: 14px;

            font-size: clamp(32px, 7vw, 44px);
            line-height: 1.05;

            letter-spacing: -2px;
            font-weight: 700;
        }

        .description {
            color: #90939c;

            font-size: 15px;
            line-height: 1.65;
        }

        /* Message preview */

        .message {
            margin-top: 29px;
            padding: 18px;

            border-radius: 17px;

            background: rgba(0, 0, 0, 0.20);

            border: 1px solid rgba(255, 255, 255, 0.065);
        }

        .message-label {
            margin-bottom: 8px;

            color: #686c75;

            font-size: 10px;
            font-weight: 700;

            letter-spacing: 1.7px;
            text-transform: uppercase;
        }

        .message-text {
            color: #dedfe3;

            font-size: 14px;
            line-height: 1.55;
        }

        /* Button */

        button {
            width: 100%;

            margin-top: 25px;
            padding: 17px 20px;

            border: 0;
            border-radius: 17px;

            cursor: pointer;

            color: white;

            font-size: 14px;
            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #ff612b,
                    #e94719
                );

            box-shadow:
                0 13px 35px rgba(255, 82, 30, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.23);

            transition:
                transform 0.18s ease,
                filter 0.18s ease,
                box-shadow 0.18s ease;
        }

        button:hover {
            transform: translateY(-2px);

            filter: brightness(1.08);

            box-shadow:
                0 18px 45px rgba(255, 82, 30, 0.30),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        button:active {
            transform: translateY(1px) scale(0.985);
        }

        .button-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .button-content svg {
            width: 18px;
            height: 18px;

            fill: none;
            stroke: currentColor;
            stroke-width: 2;

            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Footer */

        .footer {
            margin-top: 21px;

            text-align: center;

            color: #50545c;

            font-size: 10px;
            letter-spacing: 1px;
        }

        /* Mobile */

        @media (max-width: 520px) {
            .card {
                padding: 30px 24px;
                border-radius: 25px;
            }

            h1 {
                letter-spacing: -1.3px;
            }

            .description {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <div class="icon">
            <svg viewBox="0 0 24 24">
                <path d="M12 6v6l4 2"></path>
                <circle cx="12" cy="12" r="9"></circle>
            </svg>
        </div>

        <div class="eyebrow">
            Study Protocol
        </div>

        <h1>
            Time to get back.
        </h1>

        <p class="description">
            One click. One reminder. Back to the work.
        </p>

        <div class="message">

            <div class="message-label">
                Telegram message
            </div>

            <div class="message-text">
                This is a study reminder. Please get back to studying.
            </div>

        </div>

        <button onclick="sendMessage()">

            <span class="button-content">

                <svg viewBox="0 0 24 24">
                    <path d="M22 2L11 13"></path>
                    <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
                </svg>

                <span>
                    SEND MESSAGE
                </span>

            </span>

        </button>

        <div class="footer">
            PERSONAL STUDY SYSTEM
        </div>

    </main>


    <script>
        const BOT_TOKEN = "8955064380:AAErZShu92GZqTGeJyfghXeazLYHXcOdg8I";

        const CHAT_ID = "5198849684";


        function sendMessage() {

            const message =
                "This is a study reminder. Please get back to studying.";


            const url =
                "https://api.telegram.org/bot" +
                BOT_TOKEN +
                "/sendMessage";


            fetch(url, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    chat_id: CHAT_ID,

                    text: message

                })

            })

            .then(function(response) {

                return response.json();

            })

            .then(function(data) {

                if (data.ok) {

                    alert("Message sent!");

                } else {

                    alert(
                        "Telegram could not send the message."
                    );

                }

            })

            .catch(function(error) {

                alert(
                    "Something went wrong."
                );

            });

        }
    </script>

</body>
</html>
