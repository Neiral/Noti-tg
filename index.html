<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Reminder</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: Inter, Arial, sans-serif;
            color: #f5f5f5;
            background:
                radial-gradient(circle at 15% 20%, rgba(255, 90, 35, 0.14), transparent 32%),
                radial-gradient(circle at 85% 80%, rgba(255, 130, 70, 0.10), transparent 32%),
                #07080b;
        }

        .orb {
            position: fixed;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.16;
            pointer-events: none;
            animation: float 9s ease-in-out infinite alternate;
        }

        .orb.one {
            top: -180px;
            left: -150px;
            background: #ff5b25;
        }

        .orb.two {
            right: -180px;
            bottom: -180px;
            background: #ff8b55;
            animation-delay: -4s;
        }

        @keyframes float {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(35px, 25px) scale(1.12);
            }
        }

        .card {
            width: min(92%, 520px);
            padding: 42px;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.11);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.055);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            box-shadow:
                0 35px 100px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            animation: appear 0.7s ease-out;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .icon {
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 26px;
            border-radius: 18px;
            border: 1px solid rgba(255, 107, 53, 0.25);
            background: rgba(255, 107, 53, 0.10);
        }

        .icon svg {
            width: 27px;
            height: 27px;
            fill: none;
            stroke: #ff9a6a;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .eyebrow {
            margin-bottom: 10px;
            color: #ff9a6a;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        h1 {
            margin-bottom: 14px;
            font-size: clamp(32px, 7vw, 44px);
            line-height: 1.05;
            letter-spacing: -2px;
        }

        .description {
            color: #90939c;
            font-size: 15px;
            line-height: 1.65;
        }

        .message {
            margin-top: 29px;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.065);
            border-radius: 17px;
            background: rgba(0, 0, 0, 0.20);
        }

        .message-label {
            margin-bottom: 8px;
            color: #686c75;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.7px;
            text-transform: uppercase;
        }

        .message-text {
            color: #dedfe3;
            font-size: 14px;
            line-height: 1.55;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 17px 20px;
            border: 0;
            border-radius: 17px;
            cursor: pointer;
            color: white;
            font-size: 14px;
            font-weight: 700;
            background: linear-gradient(135deg, #ff612b, #e94719);
            box-shadow:
                0 13px 35px rgba(255, 82, 30, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.23);
            transition:
                transform 0.18s ease,
                filter 0.18s ease,
                box-shadow 0.18s ease;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
            box-shadow:
                0 18px 45px rgba(255, 82, 30, 0.30),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        button:active {
            transform: translateY(1px) scale(0.985);
        }

        button:disabled {
            cursor: default;
            opacity: 0.75;
        }

        .button-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .button-content svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .status {
            min-height: 20px;
            margin-top: 16px;
            text-align: center;
            color: #6f737d;
            font-size: 12px;
        }

        .status.success {
            color: #8fd9ae;
        }

        .status.error {
            color: #ff8977;
        }

        .footer {
            margin-top: 21px;
            text-align: center;
            color: #50545c;
            font-size: 10px;
            letter-spacing: 1px;
        }

        @media (max-width: 520px) {
            .card {
                padding: 30px 24px;
                border-radius: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="orb one"></div>
    <div class="orb two"></div>

    <main class="card">

        <div class="icon">
            <svg viewBox="0 0 24 24">
                <path d="M12 6v6l4 2"></path>
                <circle cx="12" cy="12" r="9"></circle>
            </svg>
        </div>

        <div class="eyebrow">Study Protocol</div>

        <h1>Time to get back.</h1>

        <p class="description">
            One click. One reminder. Back to the work.
        </p>

        <div class="message">
            <div class="message-label">Telegram message</div>

            <div class="message-text">
                This is a study reminder. Please get back to studying.
            </div>
        </div>

        <button id="sendButton">
            <span class="button-content">
                <svg viewBox="0 0 24 24">
                    <path d="M22 2L11 13"></path>
                    <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
                </svg>

                <span id="buttonText">Send Reminder</span>
            </span>
        </button>

        <div id="status" class="status"></div>

        <div class="footer">
            PERSONAL STUDY SYSTEM
        </div>

    </main>

    <script>
        const BOT_TOKEN =
            "8955064380:AAErZShu92GZqTGeJyfghXeazLYHXcOdg8I";

        const CHAT_ID =
            "5198849684";

        const MESSAGE =
            "This is a study reminder. Please get back to studying.";

        const button = document.getElementById("sendButton");
        const buttonText = document.getElementById("buttonText");
        const status = document.getElementById("status");

        button.addEventListener("click", async function () {

            button.disabled = true;
            buttonText.textContent = "Sending...";
            status.textContent = "";
            status.className = "status";

            const url =
                "https://api.telegram.org/bot" +
                BOT_TOKEN +
                "/sendMessage";

            const parameters =
                "?chat_id=" +
                encodeURIComponent(CHAT_ID) +
                "&text=" +
                encodeURIComponent(MESSAGE);

            try {

                await fetch(
                    url + parameters,
                    {
                        method: "GET",
                        mode: "no-cors",
                        cache: "no-store"
                    }
                );

                buttonText.textContent = "Reminder Sent";
                status.textContent =
                    "Your study reminder was sent to Telegram.";
                status.className = "status success";

                setTimeout(function () {
                    button.disabled = false;
                    buttonText.textContent = "Send Reminder";
                    status.textContent = "";
                    status.className = "status";
                }, 3000);

            } catch (error) {

                button.disabled = false;
                buttonText.textContent = "Send Reminder";

                status.textContent =
                    "Could not send the reminder.";
                status.className = "status error";
            }
        });
    </script>

</body>
</html>
